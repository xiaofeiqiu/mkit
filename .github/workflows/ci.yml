name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Godot 4.6.3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Static checks
        run: make layering docs-check

      - name: Kernel unit tests
        run: make ut-kernel GODOT=godot

      - name: Module unit tests
        run: make ut-modules GODOT=godot

      - name: Integration tests
        run: make int GODOT=godot
