<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mkit Docs</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --text: #182033;
      --muted: #667085;
      --line: #d8dee8;
      --accent: #2457d6;
      --accent-soft: #e8efff;
      --code-bg: #111827;
      --code-text: #edf2ff;
      --warn: #9a5b00;
      --ok: #0f766e;
      --sidebar-width: 300px;
      --mono: "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.62;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    .topbar {
      display: none;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: #fbfcff;
      padding: 18px 16px 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 14px;
    }

    .brand-title {
      color: #111827;
      font-size: 18px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .search {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      padding: 0 11px;
      margin: 4px 0 14px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .nav-group {
      margin: 0 0 16px;
    }

    .nav-heading {
      color: #344054;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.04em;
      margin: 0 0 6px;
      text-transform: uppercase;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-link {
      display: block;
      min-height: 30px;
      border-radius: 7px;
      color: #344054;
      font-size: 14px;
      line-height: 20px;
      overflow-wrap: anywhere;
      padding: 5px 8px;
      text-decoration: none;
    }

    .nav-link:hover {
      background: var(--surface-2);
      color: #101828;
    }

    .nav-link.active {
      background: var(--accent-soft);
      color: #173ea5;
      font-weight: 680;
    }

    .main {
      min-width: 0;
      padding: 28px clamp(18px, 5vw, 64px) 56px;
    }

    .doc-meta {
      max-width: 980px;
      color: var(--muted);
      font-size: 13px;
      margin: 0 auto 10px;
    }

    .content {
      max-width: 980px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(22px, 4vw, 42px);
      box-shadow: 0 14px 38px rgba(16, 24, 40, 0.06);
    }

    .content.loading,
    .content.error {
      color: var(--muted);
      min-height: 200px;
    }

    .content.error strong {
      color: #b42318;
    }

    .content h1,
    .content h2,
    .content h3,
    .content h4,
    .content h5,
    .content h6 {
      color: #111827;
      letter-spacing: 0;
      line-height: 1.25;
      margin: 1.45em 0 0.55em;
    }

    .content h1 {
      font-size: 34px;
      margin-top: 0;
    }

    .content h2 {
      border-top: 1px solid var(--line);
      font-size: 24px;
      padding-top: 22px;
    }

    .content h2:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .content h3 {
      font-size: 18px;
    }

    .content p,
    .content ul,
    .content ol,
    .content table,
    .content pre {
      margin: 0 0 1em;
    }

    .content ul,
    .content ol {
      padding-left: 1.35em;
    }

    .content li + li {
      margin-top: 0.24em;
    }

    .content code {
      background: #eef2f7;
      border: 1px solid #d9e0ea;
      border-radius: 5px;
      color: #1f2937;
      font-family: var(--mono);
      font-size: 0.92em;
      padding: 0.08em 0.34em;
    }

    .content pre {
      background: var(--code-bg);
      border-radius: 8px;
      color: var(--code-text);
      overflow: auto;
      padding: 14px 16px;
    }

    .content pre code {
      background: transparent;
      border: 0;
      color: inherit;
      display: block;
      font-size: 13px;
      line-height: 1.6;
      padding: 0;
      white-space: pre;
    }

    .content blockquote {
      border-left: 4px solid var(--accent);
      color: #475467;
      margin: 0 0 1em;
      padding: 0.1em 0 0.1em 1em;
    }

    .content table {
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      width: 100%;
    }

    .content th,
    .content td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    .content th {
      background: #f2f5f9;
      font-weight: 720;
    }

    .content hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.6em 0;
    }

    .content .missing-link {
      color: var(--warn);
    }

    @media (max-width: 880px) {
      .shell {
        display: block;
      }

      .topbar {
        align-items: center;
        background: #fbfcff;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        height: 54px;
        justify-content: space-between;
        padding: 0 14px;
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .menu-button {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        height: 34px;
        padding: 0 12px;
      }

      .sidebar {
        bottom: 0;
        box-shadow: 16px 0 40px rgba(16, 24, 40, 0.16);
        height: auto;
        left: 0;
        max-width: min(88vw, 340px);
        position: fixed;
        top: 54px;
        transform: translateX(-105%);
        transition: transform 140ms ease;
        width: var(--sidebar-width);
        z-index: 30;
      }

      body.nav-open .sidebar {
        transform: translateX(0);
      }

      .main {
        padding: 18px 12px 32px;
      }

      .content {
        border-radius: 8px;
        padding: 20px 16px;
      }

      .content h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand-title">Mkit Docs</div>
    <button class="menu-button" type="button" id="menuButton">Menu</button>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-title">Mkit Docs</div>
        <div class="brand-subtitle">Runtime, modules, pipelines, reference</div>
      </div>
      <input class="search" id="searchInput" type="search" placeholder="Search docs" autocomplete="off">
      <nav id="nav" aria-label="Documentation navigation"></nav>
    </aside>

    <main class="main">
      <div class="doc-meta" id="docMeta"></div>
      <article class="content loading" id="content">Loading...</article>
    </main>
  </div>

  <script>
    const refNames = [
      "AbilityController",
      "AbilityDefinition",
      "AbilityInstance",
      "AcceptQuestEffect",
      "ActionContext",
      "ActionRunner",
      "AdService",
      "AdServiceMock",
      "AdvanceObjectiveEffect",
      "AnalyticsService",
      "AnalyticsServiceMock",
      "ApplyStatModifierEffect",
      "ApplyStatusEffect",
      "AudioManager",
      "Blackboard",
      "Brain",
      "BuiltinCommands",
      "CastAction",
      "CloudSaveService",
      "CloudSaveServiceMock",
      "CombatResolver",
      "CommandReceiver",
      "CommandRouter",
      "CompleteQuestEffect",
      "Condition",
      "ConditionEvaluator",
      "ContentRegistry",
      "ContentValidationResult",
      "CooldownReadyCondition",
      "DamageNumberSystem",
      "DamageRequest",
      "DamageResult",
      "DashAction",
      "DealDamageEffect",
      "DebugOverlay",
      "DialogueChoice",
      "DialogueController",
      "DialogueDefinition",
      "DialogueInteractable",
      "DialogueNode",
      "DialogueRuntime",
      "DialogueUI",
      "DomainEvent",
      "DungeonGenerator",
      "EffectExecutor",
      "EffectResult",
      "EntityDefinition",
      "EntityIdentity",
      "EntityRoot",
      "EntitySpawner",
      "EquipmentController",
      "EventRouter",
      "ExperienceComponent",
      "ExperienceCurve",
      "FeedbackSystem",
      "GameAction",
      "GameBootstrap",
      "GameCommand",
      "GameEffect",
      "GameplayContext",
      "GrantItemEffect",
      "HealEffect",
      "HealthComponent",
      "HitboxComponent",
      "HurtboxComponent",
      "IAPService",
      "IAPServiceMock",
      "Interactable",
      "InteractionComponent",
      "InventoryController",
      "InventoryModel",
      "InventorySlot",
      "ItemDefinition",
      "ItemInstance",
      "LogEffect",
      "LootEntry",
      "LootRollResult",
      "LootSystem",
      "LootTableDefinition",
      "ObjectPool",
      "Portal",
      "ProgressionState",
      "ProgressionSystem",
      "QuestDefinition",
      "QuestLog",
      "QuestLogUI",
      "QuestObjectiveDefinition",
      "QuestState",
      "QuestSystem",
      "RandomService",
      "ResourceDatabase",
      "ResourcePoolComponent",
      "RewardDefinition",
      "RewardOption",
      "RewardSelectionUI",
      "RewardSystem",
      "RoomController",
      "RoomDefinition",
      "RoomGraph",
      "RoomNode",
      "RoomRuntime",
      "RunDirector",
      "RunState",
      "SaveManager",
      "SaveMigration",
      "Saveable",
      "SceneRouter",
      "ServiceRegistry",
      "ShopController",
      "ShopDefinition",
      "ShopEntry",
      "ShopUI",
      "SimpleAIEnemyBrain",
      "SpawnPoint",
      "SpawnSceneEffect",
      "StatDefinition",
      "StatModifier",
      "StatModifierDefinition",
      "State",
      "StateMachine",
      "StatsComponent",
      "StatusEffectController",
      "StatusEffectDefinition",
      "StatusEffectInstance",
      "TargetInRangeCondition",
      "TimeService",
      "TimedAttackAction",
      "UIManager",
      "UpgradeDefinition",
      "VFXSpawner",
      "WorldRouter",
      "ZoneDefinition"
    ];

    const navGroups = [
      {
        title: "Overview",
        items: [
          { title: "Mkit Documentation", path: "readme.md" },
          { title: "Pipeline", path: "pipeline.md" },
          { title: "Phase 8 Demo Testing Guide", path: "demo_phase8_testing.md" }
        ]
      },
      {
        title: "Layers",
        items: [
          { title: "Module Layer", path: "module_layer.md" },
          { title: "Kernel Layer", path: "kernel_layer.md" },
          { title: "Platform Adapter Layer", path: "platform_adapter_layer.md" }
        ]
      },
      {
        title: "Class Reference",
        items: refNames.map((name) => ({ title: name, path: `ref/${name}.md` }))
      }
    ];

    const content = document.getElementById("content");
    const nav = document.getElementById("nav");
    const docMeta = document.getElementById("docMeta");
    const searchInput = document.getElementById("searchInput");
    const menuButton = document.getElementById("menuButton");
    let currentDoc = "readme.md";

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#96;");
    }

    function normalizePath(path) {
      const parts = [];
      String(path).replace(/^\.\/+/, "").split("/").forEach((part) => {
        if (!part || part === ".") return;
        if (part === "..") {
          parts.pop();
          return;
        }
        parts.push(part);
      });
      return parts.join("/");
    }

    function resolveDocPath(href, basePath) {
      if (!href || href.startsWith("#") || href.startsWith("../") || /^[a-z]+:/i.test(href)) {
        return null;
      }
      if (!href.endsWith(".md")) {
        return null;
      }
      const baseDir = basePath.includes("/") ? basePath.slice(0, basePath.lastIndexOf("/")) : "";
      const joined = href.startsWith("/") ? href.slice(1) : (baseDir ? `${baseDir}/${href}` : href);
      return normalizePath(joined);
    }

    function slugify(text) {
      return text
        .replace(/<[^>]+>/g, "")
        .replace(/[`*_#[\]()]/g, "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9\u4e00-\u9fff]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function renderInline(text, basePath) {
      const codeTokens = [];
      let value = String(text).replace(/`([^`]+)`/g, (_match, code) => {
        const token = `@@CODE${codeTokens.length}@@`;
        codeTokens.push(`<code>${escapeHtml(code)}</code>`);
        return token;
      });

      value = escapeHtml(value);
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
        const rawHref = href.replaceAll("&amp;", "&");
        const docPath = resolveDocPath(rawHref, basePath);
        if (docPath) {
          return `<a href="#${escapeAttr(docPath)}" data-doc="${escapeAttr(docPath)}">${label}</a>`;
        }
        return `<a href="${escapeAttr(rawHref)}">${label}</a>`;
      });

      codeTokens.forEach((html, index) => {
        value = value.replaceAll(`@@CODE${index}@@`, html);
      });
      return value;
    }

    function parseTableRow(line) {
      return line
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map((cell) => cell.trim());
    }

    function isTableSeparator(line) {
      return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }

    function renderTable(lines, startIndex, basePath) {
      const header = parseTableRow(lines[startIndex]);
      let index = startIndex + 2;
      const rows = [];
      while (index < lines.length && lines[index].includes("|") && lines[index].trim() !== "") {
        rows.push(parseTableRow(lines[index]));
        index += 1;
      }
      const headHtml = header.map((cell) => `<th>${renderInline(cell, basePath)}</th>`).join("");
      const bodyHtml = rows.map((row) => {
        return `<tr>${row.map((cell) => `<td>${renderInline(cell, basePath)}</td>`).join("")}</tr>`;
      }).join("");
      return {
        html: `<table><thead><tr>${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>`,
        nextIndex: index
      };
    }

    function renderMarkdown(markdown, basePath) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let paragraph = [];
      let listType = "";
      let inCode = false;
      let codeInfo = "";
      let codeLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html += `<p>${renderInline(paragraph.join(" "), basePath)}</p>`;
        paragraph = [];
      }

      function closeList() {
        if (!listType) return;
        html += `</${listType}>`;
        listType = "";
      }

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        const trimmed = line.trim();

        if (inCode) {
          if (trimmed.startsWith("```")) {
            html += `<pre><code class="language-${escapeAttr(codeInfo)}">${escapeHtml(codeLines.join("\n"))}</code></pre>`;
            inCode = false;
            codeInfo = "";
            codeLines = [];
          } else {
            codeLines.push(line);
          }
          continue;
        }

        if (trimmed.startsWith("```")) {
          flushParagraph();
          closeList();
          inCode = true;
          codeInfo = trimmed.slice(3).trim();
          codeLines = [];
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        if (trimmed === "---" || trimmed === "***") {
          flushParagraph();
          closeList();
          html += "<hr>";
          continue;
        }

        if (i + 1 < lines.length && line.includes("|") && isTableSeparator(lines[i + 1])) {
          flushParagraph();
          closeList();
          const table = renderTable(lines, i, basePath);
          html += table.html;
          i = table.nextIndex - 1;
          continue;
        }

        const heading = /^(#{1,6})\s+(.+)$/.exec(trimmed);
        if (heading) {
          flushParagraph();
          closeList();
          const level = heading[1].length;
          const headingText = heading[2];
          const id = slugify(headingText);
          html += `<h${level} id="${escapeAttr(id)}">${renderInline(headingText, basePath)}</h${level}>`;
          continue;
        }

        if (trimmed.startsWith(">")) {
          flushParagraph();
          closeList();
          const quote = trimmed.replace(/^>\s?/, "");
          html += `<blockquote>${renderInline(quote, basePath)}</blockquote>`;
          continue;
        }

        const unordered = /^[-*]\s+(.+)$/.exec(trimmed);
        if (unordered) {
          flushParagraph();
          if (listType !== "ul") {
            closeList();
            listType = "ul";
            html += "<ul>";
          }
          html += `<li>${renderInline(unordered[1], basePath)}</li>`;
          continue;
        }

        const ordered = /^\d+\.\s+(.+)$/.exec(trimmed);
        if (ordered) {
          flushParagraph();
          if (listType !== "ol") {
            closeList();
            listType = "ol";
            html += "<ol>";
          }
          html += `<li>${renderInline(ordered[1], basePath)}</li>`;
          continue;
        }

        paragraph.push(trimmed);
      }

      if (inCode) {
        html += `<pre><code class="language-${escapeAttr(codeInfo)}">${escapeHtml(codeLines.join("\n"))}</code></pre>`;
      }
      flushParagraph();
      closeList();
      return html;
    }

    function renderNav() {
      nav.innerHTML = navGroups.map((group) => {
        const items = group.items.map((item) => {
          return `<li><a class="nav-link" href="#${escapeAttr(item.path)}" data-doc="${escapeAttr(item.path)}" data-title="${escapeAttr(item.title.toLowerCase())}">${escapeHtml(item.title)}</a></li>`;
        }).join("");
        return `<section class="nav-group"><h2 class="nav-heading">${escapeHtml(group.title)}</h2><ul class="nav-list">${items}</ul></section>`;
      }).join("");
      updateActiveNav();
    }

    function updateActiveNav() {
      document.querySelectorAll(".nav-link").forEach((link) => {
        link.classList.toggle("active", link.dataset.doc === currentDoc);
      });
    }

    function filterNav() {
      const query = searchInput.value.trim().toLowerCase();
      document.querySelectorAll(".nav-group").forEach((group) => {
        let visibleCount = 0;
        group.querySelectorAll(".nav-link").forEach((link) => {
          const visible = !query || link.dataset.title.includes(query);
          link.parentElement.hidden = !visible;
          if (visible) visibleCount += 1;
        });
        group.hidden = visibleCount === 0;
      });
    }

    function getHashDoc() {
      const raw = decodeURIComponent(window.location.hash.replace(/^#/, ""));
      return raw && raw.endsWith(".md") ? normalizePath(raw) : "readme.md";
    }

    async function loadDoc(path) {
      currentDoc = normalizePath(path || "readme.md");
      content.className = "content loading";
      content.textContent = "Loading...";
      docMeta.textContent = currentDoc;
      updateActiveNav();

      try {
        const response = await fetch(currentDoc, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const markdown = await response.text();
        content.className = "content";
        content.innerHTML = renderMarkdown(markdown, currentDoc);
        const firstHeading = content.querySelector("h1");
        const title = firstHeading ? firstHeading.textContent.trim() : currentDoc;
        document.title = `${title} | Mkit Docs`;
        docMeta.textContent = currentDoc;
        window.scrollTo({ top: 0, behavior: "auto" });
      } catch (error) {
        content.className = "content error";
        content.innerHTML = `<p><strong>Could not load document.</strong></p><p>${escapeHtml(currentDoc)} (${escapeHtml(error.message)})</p>`;
      }
    }

    window.addEventListener("hashchange", () => {
      loadDoc(getHashDoc());
      document.body.classList.remove("nav-open");
    });

    nav.addEventListener("click", (event) => {
      const link = event.target.closest("[data-doc]");
      if (!link) return;
      event.preventDefault();
      window.location.hash = link.dataset.doc;
    });

    content.addEventListener("click", (event) => {
      const link = event.target.closest("[data-doc]");
      if (!link) return;
      event.preventDefault();
      window.location.hash = link.dataset.doc;
    });

    searchInput.addEventListener("input", filterNav);

    menuButton.addEventListener("click", () => {
      document.body.classList.toggle("nav-open");
    });

    renderNav();
    loadDoc(getHashDoc());
  </script>
</body>
</html>
